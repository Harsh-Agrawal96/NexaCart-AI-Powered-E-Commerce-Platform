server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-user}:${POSTGRES_PORT:5432}/${POSTGRES_DB:user_db}
    username: ${POSTGRES_USER:user_admin}
    password: ${POSTGRES_PASSWORD:user_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
keycloak:
  server-url: http://keycloak:8080
  realm: n11bootcamp
  client-id: user-client
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
