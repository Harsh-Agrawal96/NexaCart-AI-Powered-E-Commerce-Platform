server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: discovery-service
  server:
    # Tek düğüm / yoğun ortamda replication okuma zaman aşımı uyarılarını azaltır
    peer-node-read-timeout-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
